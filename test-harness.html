<!doctype html><html><head><meta charset="utf-8"><title>AI Check plug-in — stub harness</title>

<div id="host"></div>
<script>
// Minimal stand-in for the Content Station SDK: renders the app content, calls onInit, logs the rest.
window.ContentStationSdk = {
  registerCustomApp: function (cfg) { var h = document.getElementById('host'); h.innerHTML = cfg.content; document.title = cfg.title; setTimeout(function () { try { cfg.onInit && cfg.onInit(); console.log('onInit ok'); } catch (e) { console.error('onInit threw', e); } }, 0); window.__cfg = cfg; },
  getInfo: function () { return { Ticket: '', ServerInfo: { FeatureSet: [] } }; },
  showNotification: function (c) { console.log('notify', c.content); return 1; }
};
window.csConfig = { serverUrl: '/studio/index.php' };
var __run = (/[?&]airun=([A-Za-z0-9T-]+Z?)/.exec(location.search) || [])[1];
if (__run) window.__aiCheckDemo = { id: '91908', name: 'NF1207Riddell', version: '', report: '/gt/ai-reader/91908/' + __run + '/91908-runner-' + __run + '.json', previews: { '29': '/gt/ai-reader/91908/' + __run + '/current/page-29.jpg' } };   // a real AI reader run, by its run id
else if (location.search.indexOf('aidemo') >= 0) window.__aiCheckDemo = { id: '91908', name: 'NF1207Riddell', version: '0.16', report: '/gt/ai-reader/91908/ai-test/91908-runner-ai-test.json', previews: { '29': '/gt/ai-reader/91908/ai-test/page-29.jpg' } };   // a hand-written AI read, to test how the page shows one
else if (location.search.indexOf('demo') >= 0) window.__aiCheckDemo = { id: '91908', name: 'NF1207Riddell', version: '0.4', report: '/gt/2026-09-11-template-fix-job/91908-runner-tplfix-B.json', previews: { '29': '/gt/2026-09-10-review-page-prototype/91908-p29-v0.4.jpg' } };   // 91908 (Observer fixture, internal-only) through the local proxy when served by serve.py
</script>

</body></html>
